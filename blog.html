<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="News, meeting updates, and hacker-community notes from Chattanooga Hackers Anonymous.">
  <title>CHA Blog Terminal</title>
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
  <link rel="stylesheet" href="st4t1c.css">
</head>
<body class="blog-page">
  <main class="terminal-container" id="blogTerminal">
    <div class="title-bar" aria-hidden="true">
      <div class="window-controls"><span></span><span></span><span></span></div>
      <div class="window-title">blog — static viewer</div>
    </div>
    <div class="content">
      <h1>blog</h1>
      <p><a href="index.html">&lt; back to terminal</a></p>
      <div id="latestPost" aria-live="polite"></div>
      <details id="olderPosts">
        <summary>▸ Show Older Posts</summary>
        <div id="olderPostContainer"></div>
      </details>
    </div>
  </main>

  <script>
    function appendTextElement(parent, tagName, text, className) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = String(text ?? '');
      parent.appendChild(element);
      return element;
    }

    function isSafeImageUrl(value) {
      try {
        const url = new URL(value, window.location.href);
        return url.protocol === 'https:' || (url.protocol === 'http:' && url.hostname === 'localhost');
      } catch (error) {
        return false;
      }
    }

    function renderContentItem(container, item) {
      if (typeof item === 'string') {
        appendTextElement(container, 'p', item);
        return;
      }

      if (!item || item.type !== 'image' || !isSafeImageUrl(item.src)) {
        appendTextElement(container, 'p', '[unsupported blog content omitted]');
        return;
      }

      const figure = document.createElement('figure');
      figure.className = 'post-image';
      const image = document.createElement('img');
      image.src = item.src;
      image.alt = String(item.alt || '');
      image.loading = 'lazy';
      image.decoding = 'async';
      if (Number.isInteger(item.width) && item.width > 0) image.width = item.width;
      if (Number.isInteger(item.height) && item.height > 0) image.height = item.height;
      figure.appendChild(image);
      if (item.caption) appendTextElement(figure, 'figcaption', item.caption);
      container.appendChild(figure);
    }

    function createPostElement(post) {
      const article = document.createElement('article');
      article.className = 'post';
      appendTextElement(article, 'h2', post.title, 'post-title');
      appendTextElement(article, 'div', `${post.date} by ${post.author}`, 'post-meta');
      const content = document.createElement('div');
      content.className = 'post-content';
      (Array.isArray(post.content) ? post.content : []).forEach(item => renderContentItem(content, item));
      article.appendChild(content);
      return article;
    }

    async function loadBlog() {
      const latestContainer = document.getElementById('latestPost');
      const olderContainer = document.getElementById('olderPostContainer');

      try {
        const response = await fetch('YmxvZwo=/index.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const files = await response.json();

        if (!Array.isArray(files) || files.length === 0) {
          appendTextElement(latestContainer, 'p', 'No blog posts found.');
          return;
        }

        for (let index = 0; index < files.length; index++) {
          try {
            const postResponse = await fetch(`YmxvZwo=/${encodeURIComponent(files[index])}`);
            if (!postResponse.ok) throw new Error(`HTTP ${postResponse.status}`);
            const post = await postResponse.json();
            (index === 0 ? latestContainer : olderContainer).appendChild(createPostElement(post));
          } catch (error) {
            console.warn(`Failed to load post ${files[index]}`, error);
          }
        }
      } catch (error) {
        appendTextElement(latestContainer, 'p', `Error loading blog index: ${error.message}`);
      }
    }

    loadBlog();
  </script>
</body>
</html>
